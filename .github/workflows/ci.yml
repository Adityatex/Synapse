name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-test:
    name: build + lint + typecheck + test (turbo)
    runs-on: ubuntu-latest
    # Real Redis so the collab two-replica test runs instead of skipping.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synapse/shared --filter @synapse/redis --filter @synapse/room-doc --filter @synapse/ydoc-store build
      - run: pnpm exec turbo run build lint typecheck test
