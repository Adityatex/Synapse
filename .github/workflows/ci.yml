# P0-11 — Continuous integration.
#
# Runs on every pull request and on pushes to main. The `server` and `client`
# jobs are the required status checks (branch protection on main must require
# them — a repo setting, see below — so a PR with a lint error cannot merge).
#
# Required GitHub setting (one-time, by a repo admin):
#   Settings → Branches → Add rule for `main` → Require status checks to pass
#   → check `server` and `client`.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
