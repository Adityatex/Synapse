# P1-07: staging environment on Fly.io (always-on, auto-deploy from main).
# Create once: `fly apps create synapse-staging`, then set secrets:
#   fly secrets set -a synapse-staging MONGODB_URI=... JWT_SECRET=... CORS_ORIGIN=...
app = 'synapse-staging'
primary_region = 'bom'

[build]
  dockerfile = 'server/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5000'
  LOG_LEVEL = 'info'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'
