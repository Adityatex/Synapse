# P1-06: local dev stack — `docker compose up`
# api (server, hot reload) + mongo + redis (rate-limit sessions in P2) + mailpit (OTP email catcher).
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/synapse
      CORS_ORIGIN: http://localhost:5173
      # Future P2 wiring (unused by the app today, reserved for Redis sessions):
      REDIS_URL: redis://redis:6379
      # Catch OTP mail locally instead of Gmail:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_REQUIRE_TLS: 'false'
      OTP_DELIVERY_MODE: smtp
      GMAIL_USER: dev@synapse.local
      GMAIL_APP_PASSWORD: dev
      EMAIL_FROM: Synapse <dev@synapse.local>
      JWT_SECRET: ${JWT_SECRET:-dev-only-long-enough-secret-1234567890}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./server:/app/server
      - ./packages/shared:/app/packages/shared
    command: pnpm dev

  mongo:
    image: mongo:7
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - synapse-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - synapse-redis:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  synapse-mongo:
  synapse-redis:
