# P1-06: local dev stack — `docker compose up`
# api (server, hot reload) + mongo + redis (P2: pub/sub, locks, queues) + mailpit (OTP email catcher).
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/synapse
      CORS_ORIGIN: http://localhost:5173
      # P2-02: the api connects and reports Redis state on /api/health.
      REDIS_URL: redis://redis:6379
      # P2-09: Run and Neura read a room's files from the collab server.
      COLLAB_INTERNAL_URL: http://collab:5001
      # Catch OTP mail locally instead of Gmail:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_REQUIRE_TLS: 'false'
      OTP_DELIVERY_MODE: smtp
      GMAIL_USER: dev@synapse.local
      GMAIL_APP_PASSWORD: dev
      EMAIL_FROM: Synapse <dev@synapse.local>
      JWT_SECRET: ${JWT_SECRET:-dev-only-long-enough-secret-1234567890}
      # Local testing signs up many accounts from one IP.
      RATE_LIMIT_OTP_IP_PER_HOUR: 1000
      RATE_LIMIT_LOGIN_IP_PER_15MIN: 1000
      RATE_LIMIT_GLOBAL_IP_PER_MIN: 5000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./server:/app/server
      - ./packages/shared:/app/packages/shared
      - ./packages/redis:/app/packages/redis
      # Anonymous volumes keep the image's pnpm installs and built shared/dist
      # from being hidden by the bind mounts above (host node_modules differ).
      - /app/server/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/shared/dist
      - /app/packages/redis/node_modules
      - /app/packages/redis/dist
    # Polling: file events from a Windows/macOS bind mount don't reach the
    # container, so plain nodemon never sees server edits.
    command: pnpm exec nodemon --legacy-watch server.js

  # P2-06: the collaboration server the client connects to (ws://localhost:5001 in dev,
  # or VITE_COLLAB_URL). Production-style image: rebuild with `docker compose up -d --build collab`.
  collab:
    build:
      context: .
      dockerfile: apps/collab/Dockerfile
    ports:
      - '${COLLAB_PORT:-5001}:5001'
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/synapse
      REDIS_URL: redis://redis:6379
      # Same secret as the api: collab verifies the tokens the api signs.
      JWT_SECRET: ${JWT_SECRET:-dev-only-long-enough-secret-1234567890}
      # Local testing opens many tabs from one IP.
      COLLAB_CONNECTIONS_PER_MIN: 5000
      # Compact quickly in dev so the worker is easy to watch (production default: 5 minutes).
      SNAPSHOT_DELAY_MS: 10000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  # P2-05: folds each room's updates into snapshots and prunes them (queue: Redis).
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/synapse
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - synapse-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - synapse-redis:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  synapse-mongo:
  synapse-redis:
