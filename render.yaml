# P0-13: always-on backend. Starter plan prevents Render free-tier sleep,
# which was dropping Socket.IO rooms + OTP state. healthCheckPath keeps the
# deploy green only when /api/health responds.
#
# Monorepo: the server depends on @synapse/shared (workspace:*), so the build
# runs from the repo root with pnpm (npm cannot resolve the workspace: protocol)
# and builds the shared package before the server starts.
services:
  - type: web
    name: synapse-backend
    runtime: node
    buildCommand: npx -y pnpm@10.34.5 install --frozen-lockfile --filter server... && npx -y pnpm@10.34.5 --filter @synapse/shared build
    startCommand: node server/server.js
    plan: starter
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: PORT
        value: 5000
      - key: LOG_LEVEL
        value: info
      # Set these in the Render dashboard (never commit secrets):
      # MONGODB_URI, JWT_SECRET, CORS_ORIGIN, JUDGE0_API_HOST,
      # JUDGE0_API_KEY, GROQ_API_KEY, GMAIL_USER, GMAIL_APP_PASSWORD,
      # EMAIL_FROM, BREVO_API_KEY, BREVO_SENDER_EMAIL, SENTRY_DSN, APP_RELEASE
